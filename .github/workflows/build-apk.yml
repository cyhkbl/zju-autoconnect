name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-build:
    name: Run unit tests & build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests (SrunCrypto 算法与 Python 等价)
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Locate APK
        id: locate
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          echo "APK: $APK"
          ls -la "$APK"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZJU-AutoConnect-debug
          path: ${{ steps.locate.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Create release on tag
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: ZJU-AutoConnect-debug
          path: dist

      - name: Rename to readable filename
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          mv dist/app-debug.apk "dist/ZJU-AutoConnect-${TAG_NAME}-debug.apk"
          ls -la dist/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ZJU-AutoConnect-${{ github.ref_name }}-debug.apk
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## ZJU 校园网自动连接 (Android)

            **直接下载下方的 `*.apk` 文件传到手机安装即可。**

            - 🪪 首次启动填学号 + 校园网密码,本地加密保存 (EncryptedSharedPreferences)
            - 🔔 必须授予通知权限,前台服务才能运行
            - 📍 Android 13+ 还需要位置权限(读取 WiFi 名称)
            - 🔄 MIUI/EMUI/ColorOS 等深度定制 ROM 需在系统设置额外开启自启动

            完整说明见 [README](https://github.com/cyhkbl/zju-autoconnect#安装)。

            仓库是 private,仅供自用。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
